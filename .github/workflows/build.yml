name: Build

on:
  workflow_call:
  pull_request:
    branches: [main]

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate Gradle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

  build:
    name: JVM 25
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Quartz
        uses: ./.github/actions/setup-quartz
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Build and test
        run: ./gradlew build --no-daemon --stacktrace -Pquartz.embed="$QUARTZ_EMBED" -Pquartz.jvm="$QUARTZ_JVM" -Pquartz.natives="$QUARTZ_NATIVES" -Pquartz.library="$QUARTZ_LIBRARY"
      - name: Upload jar
        uses: actions/upload-artifact@v7
        with:
          name: pluginupdater
          path: build/libs/pluginupdater-*[0-9].jar
